<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Ігрова кімната - Мафія</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <nav class="nav">
    <a href="index.html" class="nav-logo" id="navLogo">МАФ<span>ІЯ</span></a>
    <div class="nav-right">
    </div>
  </nav>

  <!-- SETUP -->
  <div class="screen" id="setupScreen">
    <div class="setup-layout">
      <div class="setup-panel left">
        <div style="margin-bottom:1.25rem">
          <div class="section-title">
            <i class="fas fa-users"></i> Гравці
            <span id="playerCountBadge" style="color:var(--accent);margin-left:.3rem">0</span>
          </div>
          <div class="player-add-row">
            <input type="text" id="playerNameInput" placeholder="Ім'я гравця" maxlength="20" autocomplete="off">
            <button class="add-btn" id="addPlayerBtn">+</button>
          </div>
          <div class="player-list" id="playerList"></div>
        </div>
        <div>
          <div class="section-title"><i class="fas fa-masks-theater"></i> Ролі</div>
          <div class="roles-grid" id="rolesGrid"></div>
          <div class="roles-summary warn" id="rolesSummary">Додайте гравців і призначте ролі</div>
        </div>
      </div>
      <div class="setup-panel">
        <div class="setup-tabs">
          <button class="setup-tab active" data-tab="start">Старт</button>
          <button class="setup-tab" data-tab="rooms">Кімнати</button>
        </div>
        <div id="tabStart">
          <div class="setup-start">
            <div id="settingsSection" style="width:100%;max-width:620px;max-height:60vh;overflow-y:auto;padding-right:.3rem"></div>
            <button class="btn-primary" id="startIntroBtn" disabled style="font-size:.95rem;padding:.8rem 2rem">
              <i class="fas fa-play"></i> Роздати ролі
            </button>
            <div style="font-size:.78rem;color:var(--text3)" id="startHint">Додайте гравців та призначте ролі</div>
          </div>
        </div>
        <div id="tabRooms" style="display:none">
          <div style="margin-bottom:.75rem">
            <button class="btn-ghost btn-sm" id="saveRoomBtn" style="width:100%;justify-content:center">
              <i class="fas fa-save"></i> Зберегти поточну кімнату
            </button>
          </div>
          <div class="room-list" id="savedRoomsList"></div>
          <div style="color:var(--text3);font-size:.8rem;text-align:center;padding:.75rem;display:none" id="noRoomsMsg">Немає збережених кімнат</div>
        </div>
      </div>
    </div>
  </div>

  <!-- INTRO -->
  <div class="screen" id="introScreen">
    <div class="intro-screen-content">
      <div class="intro-progress">
        Гравець <strong id="introCurrentName">-</strong>
        <span id="introProgress"></span>
      </div>
      <div class="card-flip-wrap">
        <div class="card-flip" id="roleCard">
          <div class="card-face card-back-face">
            <div class="card-back-logo">МАФІЯ</div>
            <div class="card-back-sub">натисни щоб відкрити</div>
          </div>
          <div class="card-face card-front-face" id="cardFrontContent"></div>
        </div>
      </div>
      <div class="intro-actions">
        <button class="btn-secondary" id="introNextBtn" style="visibility:hidden">
          <i class="fas fa-arrow-right"></i> Наступний
        </button>
        <button class="btn-primary" id="introStartGameBtn" style="visibility:hidden">
          <i class="fas fa-moon"></i> Місто засинає
        </button>
        <button class="btn-ghost" id="introSkipBtn" style="opacity:.4;font-size:.78rem">
          <i class="fas fa-forward-fast"></i> [тест] пропустити картки
        </button>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="gameScreen">
    <div class="phase-bar" id="phaseBar">
      <div class="phase-title" id="phaseTitle"><i class="fas fa-moon"></i> Ніч 0</div>
      <div class="timer-wrap">
        <button class="timer-btn timer-adj-hide" id="timerMinus" title="−15с"><i class="fas fa-minus"></i></button>
        <div class="timer-display stopped" id="timerDisplay">1:00</div>
        <button class="timer-btn" id="timerStartBtn" title="Старт/Пауза"><i class="fas fa-play"></i></button>
        <button class="timer-btn" id="timerReset" title="Скинути"><i class="fas fa-undo"></i></button>
        <button class="timer-btn timer-adj-hide" id="timerPlus" title="+15с"><i class="fas fa-plus"></i></button>
      </div>
      <div class="phase-actions">
        <button class="btn-ghost btn-sm" id="nextPhaseBtn">
          <i class="fas fa-forward"></i> <span id="nextPhaseLabel">День 1</span>
        </button>
        <button class="btn-danger btn-sm" id="endGameBtn" title="Завершити гру"><i class="fas fa-stop"></i></button>
      </div>
    </div>
    <div class="game-body">
      <div class="game-main" id="gameMain">
        <div id="nightActionsSection"></div>
        <div id="dayVotingSection"></div>
        <div>
          <div class="players-section-title">
            <i class="fas fa-user-check"></i> Активні
            <span id="aliveCountLabel" style="color:var(--accent);margin-left:.25rem"></span>
          </div>
          <div class="players-grid" id="alivePlayersGrid"></div>
          <div id="deadSection" style="display:none">
            <div class="players-section-title" style="margin-top:.75rem">
              <i class="fas fa-skull"></i> Вибули
              <span id="deadCountLabel" style="color:var(--text3);margin-left:.25rem"></span>
            </div>
            <div class="players-grid" id="deadPlayersGrid"></div>
          </div>
        </div>
      </div>
      <div class="game-sidebar">
        <div class="sidebar-tabs">
          <button class="stab active" data-stab="log">Лог</button>
          <button class="stab" data-stab="stats">Стан</button>
          <button class="stab" data-stab="notes">Нотатки</button>
        </div>
        <div class="sidebar-content" id="sidebarContent">
          <div id="logTab"><div id="eventLog"></div></div>
          <div id="statsTab" style="display:none"></div>
          <div id="notesTab" style="display:none;height:100%">
            <textarea class="notes-area" id="notesArea" placeholder="Нотатки ведучого..."></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- END -->
  <div class="screen" id="endScreen">
    <div class="end-screen-content" id="endScreenContent">
      <div class="win-badge" id="winBadge"></div>
      <div class="win-title" id="winTitle"></div>
      <div class="win-subtitle" id="winSubtitle"></div>
      <div class="win-summary" id="winSummary"></div>
      <div style="display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center">
        <button class="btn-primary" id="newGameAfterBtn"><i class="fas fa-redo"></i> Нова гра</button>
        <button class="btn-ghost" id="saveScreenshotBtn"><i class="fas fa-camera"></i> Зберегти фото</button>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle"></div>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- OVERLAYS -->
  <div class="t-overlay night-ov" id="nightOverlay" style="display:none">
    <div class="t-overlay-icon">🌙</div>
    <div class="t-overlay-text" id="nightOverlayText">НАСТАЄ НІЧ</div>
    <div class="t-overlay-sub">Всі одягають маски</div>
    <div class="t-overlay-cont">Торкнись будь-де щоб продовжити</div>
  </div>
  <div class="t-overlay day-ov" id="dayOverlay" style="display:none">
    <div class="t-overlay-icon" id="dayOverlayIcon">☀️</div>
    <div class="t-overlay-text">НАСТАЄ РАНОК</div>
    <div class="t-overlay-result" id="dayOverlayResult"></div>
    <div class="t-overlay-cont">Торкнись будь-де щоб продовжити</div>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
